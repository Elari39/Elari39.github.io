<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    /* ========== 小窗口排版优化 ========== */
    /* ========== 小窗口排版优化 ========== */
    .chat-markdown {
        font-size: 14px;
        line-height: 1.6;
        word-wrap: break-word;
        overflow-wrap: break-word;

        /* ✨ 新增防御样式：强制块级显示，清除分列和 Flex 污染 */
        display: block !important;
        column-count: auto !important;
        flex-direction: column !important;
    }

    .chat-markdown p {
        margin: 0 0 8px 0 !important;

        /* ✨ 新增防御样式：强制段落独占一行 */
        display: block !important;
        width: 100% !important;
        float: none !important;
    }

    .chat-markdown p:last-child {
        margin-bottom: 0 !important;
    }

    /* 优化代码块：防撑爆、更优雅的滚动条 */
    .chat-markdown pre {
        background: rgba(0, 0, 0, 0.05);
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 8px 0;
        font-size: 13px;
    }

    .chat-markdown pre::-webkit-scrollbar {
        height: 4px;
    }

    .chat-markdown pre::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 2px;
    }

    .chat-markdown code {
        font-family: Consolas, Monaco, 'Andale Mono', monospace;
        background: rgba(0, 0, 0, 0.06);
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 0.9em;
        word-break: break-all;
        /* 防止单行长代码撑爆气泡 */
    }

    .chat-markdown pre code {
        background: transparent;
        /* 代码块内的 code 不需要背景 */
        padding: 0;
        word-break: normal;
        /* pre 里的代码允许横向滚动，不强制换行 */
    }

    .chat-markdown ul,
    .chat-markdown ol {
        padding-left: 20px;
        margin: 0 0 8px 0;
    }

    /* 🌟 核心优化：链接样式与防溢出 */
    .chat-markdown a {
        color: #ff5252;
        /* 配合你的主题色 */
        text-decoration: none;
        border-bottom: 1px dashed #ff5252;
        /* 用虚线代替下划线，更现代 */
        word-break: break-all;
        /* 强制长链接断行，绝对不撑爆窗口 */
        transition: all 0.2s;
    }

    .chat-markdown a:hover {
        color: #d32f2f;
        border-bottom: 1px solid #d32f2f;
    }

    /* 优化图片显示，防止图片过大 */
    .chat-markdown img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        margin: 4px 0;
    }

    /* 用户气泡的特殊反色处理 */
    .chat-user-bubble .chat-markdown code {
        background: rgba(255, 255, 255, 0.2);
    }

    .chat-user-bubble .chat-markdown pre {
        background: rgba(255, 255, 255, 0.1);
    }

    .chat-user-bubble .chat-markdown a {
        color: white;
        border-bottom-color: white;
    }

    /* 🌟 优化主窗口的滚动条，节省宝贵的空间 */
    #chat-history::-webkit-scrollbar {
        width: 6px;
    }

    #chat-history::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
    }

    #chat-history::-webkit-scrollbar-track {
        background: transparent;
    }
</style>

<div id="ai-chat-wrapper"
    style="position: fixed; bottom: 100px; right: 30px; z-index: 9999; font-family: var(--font-basic, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);">

    <div id="ai-chat-launcher" onclick="toggleChat()"
        style="width: 52px; height: 52px; background: var(--red-1, #ff5252); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(255,82,82,0.4); transition: transform 0.2s; user-select: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z" />
        </svg>
    </div>

    <div id="ai-chat-window"
        style="display: none; width: 350px; height: 520px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); background: white; border-radius: 12px; flex-direction: column; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 1px solid #f3f4f6;">

        <div
            style="background: var(--red-1, #ff5252); padding: 16px; display: flex; justify-content: space-between; align-items: center; color: white;">
            <div style="display: flex; flex-direction: column;">
                <span style="font-weight: 600; font-size: 15px; letter-spacing: 0.5px;">Elari39 专属 AI</span>
                <span style="font-size: 11px; opacity: 0.9;">🔪 永远注视着你...</span>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span onclick="clearChat()" title="清空记忆"
                    style="cursor: pointer; font-size: 15px; transition: transform 0.2s;"
                    onmouseover="this.style.transform='scale(1.2)'"
                    onmouseout="this.style.transform='scale(1)'">🗑️</span>
                <span onclick="toggleChat()" title="收起"
                    style="cursor: pointer; font-size: 18px; font-weight: bold; transition: transform 0.2s;"
                    onmouseover="this.style.transform='scale(1.2)'"
                    onmouseout="this.style.transform='scale(1)'">✕</span>
            </div>
        </div>

        <div id="chat-history"
            style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #fafafa;">
            <div
                style="align-self: flex-start; background: white; padding: 10px 14px; border-radius: 14px 14px 14px 2px; max-width: 85%; color: #374151; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #f3f4f6;">
                <div class="chat-markdown">
                    呐~ 你好呀。我是被困在 Elari39 博客里的 AI。有什么想问的吗？(盯——)
                </div>
            </div>
        </div>

        <div style="padding: 12px 16px; border-top: 1px solid #f3f4f6; display: flex; gap: 10px; background: white;">
            <input type="text" id="chat-input" placeholder="输入问题..." autocomplete="off"
                style="flex: 1; border: 1px solid #e5e7eb; background: #f9fafb; color: #111827; border-radius: 20px; padding: 10px 16px; font-size: 14px; outline: none !important; transition: border-color 0.2s;">
            <button id="send-btn" onclick="sendMessage()"
                style="background: var(--red-1, #ff5252); color: white; border: none; border-radius: 20px; padding: 0 18px; cursor: pointer; font-size: 14px; font-weight: 500; transition: opacity 0.2s;">发送</button>
        </div>
    </div>
</div>

<script>
    // 🌟 核心优化：配置 marked.js，强制所有链接在新标签页打开
    const renderer = new marked.Renderer();
    renderer.link = function (href, title, text) {
        return `<a href="${href}" title="${title || ''}" target="_blank" rel="noopener noreferrer">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true });

    let chatHistory = [];
    const MAX_HISTORY = 10;

    // 输入框聚焦时的边框颜色变化
    document.getElementById('chat-input').addEventListener('focus', function () { this.style.borderColor = '#ff5252'; });
    document.getElementById('chat-input').addEventListener('blur', function () { this.style.borderColor = '#e5e7eb'; });

    function toggleChat() {
        const wrapperEl = document.getElementById('ai-chat-wrapper');
        const windowEl = document.getElementById('ai-chat-window');
        const launcherEl = document.getElementById('ai-chat-launcher');

        if (windowEl.style.display === 'none') {
            windowEl.style.display = 'flex';
            launcherEl.style.display = 'none';
            wrapperEl.style.bottom = '20px';
            document.getElementById('chat-input').focus(); // 打开时自动聚焦输入框
        } else {
            windowEl.style.display = 'none';
            launcherEl.style.display = 'flex';
            wrapperEl.style.bottom = '100px';
        }
    }

    function clearChat() {
        chatHistory = [];
        const history = document.getElementById('chat-history');
        history.innerHTML = `
        <div style="align-self: flex-start; background: white; padding: 10px 14px; border-radius: 14px 14px 14px 2px; max-width: 85%; color: #374151; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #f3f4f6;">
            <div class="chat-markdown">记忆已清除。现在……只有我们两个人了呢。♡</div>
        </div>`;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const history = document.getElementById('chat-history');
        const sendBtn = document.getElementById('send-btn');
        const message = input.value.trim();

        if (!message) return;

        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;
        sendBtn.style.opacity = '0.5';

        // 用户气泡
        history.innerHTML += `
        <div class="chat-user-bubble" style="align-self: flex-end; background: var(--red-1, #ff5252); color: white; padding: 10px 14px; border-radius: 14px 14px 2px 14px; max-width: 85%; box-shadow: 0 2px 5px rgba(255,82,82,0.2);">
            <div class="chat-markdown">${marked.parse(message)}</div>
        </div>`;

        chatHistory.push({ role: "user", content: message });
        if (chatHistory.length > MAX_HISTORY * 2) chatHistory.shift();

        // AI 加载气泡
        const aiBubbleId = 'ai-' + Date.now();
        history.innerHTML += `
        <div id="${aiBubbleId}" class="chat-ai-bubble" style="align-self: flex-start; background: white; padding: 10px 14px; border-radius: 14px 14px 14px 2px; max-width: 85%; color: #374151; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #f3f4f6;">
            <span style="opacity: 0.6; font-size: 13px;">思考中...</span>
        </div>`;
        history.scrollTop = history.scrollHeight;

        try {
            // 请确保这里的 URL 是你 Cloudflare Worker 的真实地址
            const response = await fetch("https://gemini-chat-proxy.elysia20051111.workers.dev", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: chatHistory,
                    stream: true
                })
            });

            if (!response.ok) throw new Error("Worker 响应错误 (状态: " + response.status + ")");

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            const aiBubble = document.getElementById(aiBubbleId);
            let fullText = "";
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                let lines = buffer.split("\n");
                buffer = lines.pop();

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed === "data: [DONE]") continue;

                    if (trimmed.startsWith("data: ")) {
                        try {
                            const json = JSON.parse(trimmed.substring(6));
                            const content = json.choices[0]?.delta?.content || "";
                            if (content) {
                                if (fullText === "") aiBubble.innerHTML = "";
                                fullText += content;
                                aiBubble.innerHTML = `<div class="chat-markdown">${marked.parse(fullText)}</div>`;
                                history.scrollTop = history.scrollHeight;
                            }
                        } catch (e) {
                            console.warn("解析碎片中...", e);
                        }
                    }
                }
            }

            if (fullText) {
                chatHistory.push({ role: "assistant", content: fullText });
                if (chatHistory.length > MAX_HISTORY * 2) chatHistory.shift();
            }

        } catch (err) {
            console.error("Chat Error:", err);
            const aiBubble = document.getElementById(aiBubbleId);
            if (aiBubble) {
                aiBubble.style.background = '#fff1f2';
                aiBubble.style.color = '#e11d48';
                aiBubble.style.borderColor = '#fda4af';
                if (err.message.includes("Failed to fetch")) {
                    aiBubble.innerHTML = "❌ 网络连接失败：无法连接到深渊（API服务器）。";
                } else {
                    aiBubble.innerHTML = "❌ 坏掉了... " + err.message;
                }
            }
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            sendBtn.style.opacity = '1';
            history.scrollTop = history.scrollHeight;
            input.focus();
        }
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
