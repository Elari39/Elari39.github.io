<!doctype html>
<!--
  OG 卡片模板。
  由 scripts/prepare-assets.py 用无头 Chrome 渲染成 public/og.png（1200×630）。
  这里刻意不引任何外部资源：字体走系统字体栈，图形是 CSS，
  和站点本体保持同一套色板（见 src/styles/global.css）。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 84px;
        background-color: #121110;
        /* 与站点底纹同一套语言：暖 bloom + 冷 bloom + 视口下方的一层余温 */
        background-image:
          radial-gradient(1180px 700px at 12% -12%, rgba(224, 141, 109, 0.32), transparent 70%),
          radial-gradient(880px 580px at 100% 4%, rgba(93, 184, 166, 0.2), transparent 66%),
          radial-gradient(1100px 700px at 50% 116%, rgba(224, 141, 109, 0.16), transparent 68%);
        color: #faf9f5;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia,
          'Microsoft YaHei', 'PingFang SC', sans-serif;
      }

      /* 与站点同一枚印记。放在 h1 上方那条空白里，不与文字重叠 */
      .sigil {
        position: absolute;
        top: 34px;
        right: 84px;
        width: 110px;
        height: 110px;
        color: #e08d6d;
      }

      .sigil svg {
        width: 100%;
        height: 100%;
      }

      .rule {
        width: 96px;
        height: 4px;
        background: linear-gradient(90deg, #e08d6d, rgba(224, 141, 109, 0.15));
        margin-bottom: 34px;
      }

      h1 {
        font-size: 78px;
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -1.5px;
      }

      .cn {
        margin-top: 18px;
        font-size: 34px;
        color: #e9a389;
        letter-spacing: 4px;
      }

      .sub {
        margin-top: 30px;
        max-width: 900px;
        font-size: 25px;
        line-height: 1.5;
        color: #d8d4cb;
      }

      .entries {
        margin-top: 42px;
        display: flex;
        gap: 18px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 21px;
        color: #a09d96;
        letter-spacing: 0.5px;
      }

      .entries span {
        padding: 9px 20px;
        border: 1px solid #2e2c28;
        border-radius: 999px;
        background: rgba(31, 30, 27, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="sigil" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="100" cy="100" r="80" stroke-dasharray="4 20" opacity="0.55"></circle>
        <path d="M100 6v11M100 183v11M6 100h11M183 100h11" opacity="0.7"></path>
        <circle cx="100" cy="100" r="92" opacity="0.22"></circle>
        <path d="M100 50 150 100 100 150 50 100Z" opacity="0.45"></path>
        <path d="M100 74 126 100 100 126 74 100Z" opacity="0.85"></path>
        <path d="M100 92 108 100 100 108 92 100Z" fill="currentColor" stroke="none" opacity="0.9"></path>
      </svg>
    </div>

    <div class="rule"></div>
    <h1>Ashen Witch's Grimoire</h1>
    <p class="cn">灰烬女巫的魔典</p>
    <p class="sub">三个自建项目的条目库：博客系统、短链服务，以及一个本地文档保险箱。</p>
    <div class="entries">
      <span>Notes of Ashen</span>
      <span>AshenCourier</span>
      <span>CryptoWitch</span>
    </div>
  </body>
</html>
